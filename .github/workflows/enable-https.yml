name: Enable custom-domain HTTPS

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: custom-domain-https
  cancel-in-progress: false

jobs:
  enable-https:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out website source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Wait for the certificate and enforce HTTPS
        run: node scripts/enable-https.mjs
        env:
          GH_TOKEN: ${{ github.token }}
